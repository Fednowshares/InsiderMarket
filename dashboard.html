
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Fednow Shares</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --primary: #5861ed;
    --page-bg: #f7f7f7;
    --text: #ffffff;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--page-bg);
    color: #333;
}

/* TOP NAVIGATION */

.topbar {
    height: 150px;
    background: #fff;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 9% 19px;
    border-bottom: 1px solid #eee;
}

.nav-left {
    display: flex;
    align-items: center;
}

.back-link {
    text-decoration: none;
    color: #528fe0;
    font-size: 25px;
    line-height: 1;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-link {
    text-decoration: none;
    color: #242424;
    display: flex;
    align-items: center;
    justify-content: center;
}

.home-link {
    width: 48px;
    height: 40px;
    background: #528fe0;
    color: white;
    border-radius: 6px;
}

.nav-link svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.language {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    white-space: nowrap;
}

.language select {
    width: 14px;
    border: 0;
    outline: none;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
}

/* DASHBOARD */

.dashboard {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 6px 26px 35px;
}

.stats {
    display: flex;
    flex-direction: column;
    gap: 35px;
}

/* SUMMARY CARDS */

.stat-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 17px;
    min-height: 110px;
    padding: 18px 17px;
    overflow: hidden;
    background: var(--primary);
    border-radius: 10px;
    color: var(--text);
}

.stat-card::after {
    content: "";
    position: absolute;
    width: 91px;
    height: 91px;
    top: -45px;
    right: -45px;
    background: #fff;
    border-radius: 50%;
}

.stat-icon {
    flex: 0 0 53px;
    width: 53px;
    height: 53px;
    border-radius: 50%;
    background: #fff;
    color: #657092;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}

.stat-icon svg {
    width: 25px;
    height: 25px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.stat-info {
    min-width: 0;
    z-index: 1;
}

.stat-value {
    font-size: 20px;
    line-height: 1.35;
    font-weight: 400;
    margin-bottom: 10px;
    color: white;
}

.stat-label {
    font-size: 18px;
    line-height: 1.3;
    font-weight: 400;
    color: #f4f4ff;
}

/* FLOATING CHAT BUTTON */

.chat-button {
    position: fixed;
    right: 16px;
    bottom: 28px;
    width: 66px;
    height: 66px;
    border: 0;
    border-radius: 50%;
    background: #0873e8;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    box-shadow: 0 3px 10px #0002;
    cursor: pointer;
}

.chat-inner {
    width: 43px;
    height: 38px;
    background: white;
    border-radius: 13px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chat-inner::after {
    content: "";
    position: absolute;
    bottom: -4px;
    right: 7px;
    width: 12px;
    height: 12px;
    background: white;
    transform: rotate(35deg);
    border-radius: 2px;
}

.chat-arrow {
    color: #508ad5;
    font-size: 18px;
    position: relative;
    z-index: 1;
}

/* RESPONSIVE LAYOUT */

@media (max-width: 500px) {
    .topbar {
        height: 150px;
        padding: 0 9% 19px;
    }

    .nav-right {
        gap: 25px;
    }

    .home-link {
        width: 48px;
        height: 40px;
    }

    .dashboard {
        padding: 6px 26px 35px;
    }

    .stats {
        gap: 35px;
    }

    .stat-card {
        min-height: 110px;
        padding: 18px 17px;
        gap: 17px;
    }

    .stat-icon {
        flex-basis: 53px;
        width: 53px;
        height: 53px;
    }

    .stat-value {
        font-size: 20px;
        margin-bottom: 10px;
    }

    .stat-label {
        font-size: 18px;
    }

    .chat-button {
        right: 16px;
        bottom: 28px;
    }
}

@media (max-width: 360px) {
    .dashboard {
        padding-left: 16px;
        padding-right: 16px;
    }

    .nav-right {
        gap: 15px;
    }

    .stat-card {
        gap: 12px;
        padding-left: 13px;
    }

    .stat-icon {
        flex-basis: 48px;
        width: 48px;
        height: 48px;
    }

    .stat-value {
        font-size: 19px;
    }

    .stat-label {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="nav-left">
        <a class="back-link" href="index.html" aria-label="Back">
            &rarr;
        </a>
    </div>

    <nav class="nav-right">

        <a class="nav-link home-link" href="index.html"
           aria-label="Home">
            <svg viewBox="0 0 24 24">
                <path d="m3 10 9-7 9 7"/>
                <path d="M5.5 9v12h13V9"/>
                <path d="M9 21v-7h6v7"/>
            </svg>
        </a>

        <label class="language">
            <span>English</span>
            <select aria-label="Language"
                    onchange="document.documentElement.lang=this.value">
                <option value="en" selected>⌄</option>
                <option value="fr">FR</option>
                <option value="es">ES</option>
            </select>
        </label>

        <a class="nav-link" href="index.html"
           aria-label="Profile">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
            </svg>
        </a>

    </nav>

</header>

<main class="dashboard">

    <section class="stats">

        <!-- ALL TRANSACTIONS -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 8h16l-1 12H5L4 8Z"/>
                    <path d="M4 8l3-5h10l3 5"/>
                    <path d="M9 8a3 3 0 0 0 6 0"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">24</div>
                <div class="stat-label">All Transactions</div>
            </div>
        </article>

        <!-- TOTAL DEPOSIT -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M5 2h9l5 5v15H5V2Z"/>
                    <path d="M14 2v6h5"/>
                    <path d="M12 11v7"/>
                    <path d="M9 14h6"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$100</div>
                <div class="stat-label">Total Deposit</div>
            </div>
        </article>

        <!-- TOTAL INVESTMENT -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3 20 6v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3Z"/>
                    <path d="m8 12 3 3 5-6"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$256</div>
                <div class="stat-label">Total Investment</div>
            </div>
        </article>

        <!-- TOTAL PROFIT -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="1"/>
                    <path d="M3 9h18"/>
                    <path d="M7 14h4"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$1,444</div>
                <div class="stat-label">Total Profit</div>
            </div>
        </article>

        <!-- TOTAL TRANSFER -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12h14"/>
                    <path d="m12 5 7 7-7 7"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$0</div>
                <div class="stat-label">Total Transfer</div>
            </div>
        </article>

        <!-- TOTAL WITHDRAW -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="3" width="16" height="18" rx="1"/>
                    <path d="M8 8h8M8 12h3"/>
                    <path d="m13 15 2 2 3-4"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$0</div>
                <div class="stat-label">Total Withdraw</div>
            </div>
        </article>

    </section>

</main>

<!-- Floating chat icon -->
<button class="chat-button" type="button"
        aria-label="Chat support"
        onclick="alert('Please connect your support chat service here.')">
    <span class="chat-inner">
        <span class="chat-arrow">&#9650;</span>
    </span>
</button>

</body>
</html>
