<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Fednow Shares</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --primary: #5861ed;
    --page-bg: #f7f7f7;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--page-bg);
    color: #333;
}

/* TOP NAVIGATION */

.topbar {
    height: 88px;
    background: #fff;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 9% 15px;
    border-bottom: 1px solid #eee;
}

.back-link {
    text-decoration: none;
    color: #528fe0;
    font-size: 25px;
    line-height: 1;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-link {
    text-decoration: none;
    color: #242424;
    display: flex;
    align-items: center;
    justify-content: center;
}

.home-link {
    width: 48px;
    height: 40px;
    background: #528fe0;
    color: white;
    border-radius: 6px;
}

.nav-link svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.language {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 15px;
    white-space: nowrap;
}

.language select {
    width: 18px;
    border: 0;
    outline: none;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
}

/* DASHBOARD */

.dashboard {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 26px 30px;
}

.stats {
    display: flex;
    flex-direction: column;
    gap: 24px;
}

/* SUMMARY CARDS */

.stat-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 17px;
    min-height: 110px;
    padding: 18px 17px;
    overflow: hidden;
    background: var(--primary);
    border-radius: 10px;
    color: #fff;
}

.stat-card::after {
    content: "";
    position: absolute;
    width: 91px;
    height: 91px;
    top: -45px;
    right: -45px;
    background: #fff;
    border-radius: 50%;
}

.stat-icon {
    flex: 0 0 53px;
    width: 53px;
    height: 53px;
    border-radius: 50%;
    background: #fff;
    color: #657092;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}

.stat-icon svg {
    width: 25px;
    height: 25px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.stat-info {
    min-width: 0;
    z-index: 1;
}

.stat-value {
    font-size: 20px;
    line-height: 1.35;
    font-weight: 400;
    margin-bottom: 10px;
    color: #fff;
}

.stat-label {
    font-size: 18px;
    line-height: 1.3;
    font-weight: 400;
    color: #f4f4ff;
}

/* CUSTOMER SUPPORT BUTTON */

.chat-button {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: none;
    background: #1760d5;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
    cursor: pointer;
    z-index: 1001;
}

.chat-button svg {
    width: 32px;
    height: 32px;
    fill: currentColor;
}

.chat-dot {
    position: absolute;
    left: 1px;
    bottom: 3px;
    height: 18px;
    width: 18px;
    background: #39d29b;
    border: 3px solid white;
    border-radius: 50%;
}

/* SUPPORT MENU */

.support-menu {
    display: none;
    position: fixed;
    right: 30px;
    bottom: 108px;
    z-index: 1000;
    background: #fff;
    padding: 16px;
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0,0,0,.18);
    width: 230px;
}

.support-menu.open {
    display: block;
}

.support-title {
    font-size: 16px;
    font-weight: bold;
    color: #172d32;
    margin: 0 0 13px;
}

.support-link {
    display: block;
    text-decoration: none;
    color: #fff;
    padding: 13px 10px;
    border-radius: 5px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
}

.email-support {
    background: #568ed7;
    margin-bottom: 10px;
}

.whatsapp-support {
    background: #25D366;
}

.support-link:hover {
    opacity: .9;
}

/* RESPONSIVE LAYOUT */

@media (max-width: 500px) {
    .topbar {
        height: 78px;
        padding: 0 9% 13px;
    }

    .nav-right {
        gap: 20px;
    }

    .home-link {
        width: 43px;
        height: 36px;
    }

    .dashboard {
        padding: 10px 26px 25px;
    }

    .stats {
        gap: 22px;
    }

    .stat-card {
        min-height: 105px;
        padding: 16px;
        gap: 15px;
    }

    .stat-icon {
        flex-basis: 50px;
        width: 50px;
        height: 50px;
    }

    .stat-value {
        font-size: 20px;
        margin-bottom: 8px;
    }

    .stat-label {
        font-size: 17px;
    }

    .chat-button {
        width: 66px;
        height: 66px;
        right: 10px;
        bottom: 70px;
    }

    .support-menu {
        right: 10px;
        bottom: 145px;
    }
}

@media (max-width: 360px) {
    .dashboard {
        padding-left: 16px;
        padding-right: 16px;
    }

    .nav-right {
        gap: 14px;
    }

    .stat-card {
        gap: 12px;
        padding-left: 13px;
    }

    .stat-icon {
        flex-basis: 46px;
        width: 46px;
        height: 46px;
    }

    .stat-value {
        font-size: 19px;
    }

    .stat-label {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <a class="back-link" href="index.html" aria-label="Back">
        &#8592;
    </a>

    <nav class="nav-right">

        <a class="nav-link home-link" href="index.html"
           aria-label="Home">
            <svg viewBox="0 0 24 24">
                <path d="m3 10 9-7 9 7"/>
                <path d="M5.5 9v12h13V9"/>
                <path d="M9 21v-7h6v7"/>
            </svg>
        </a>

        <label class="language">
            <span>English</span>
            <select aria-label="Language">
                <option value="en" selected>⌄</option>
                <option value="fr">FR</option>
                <option value="es">ES</option>
            </select>
        </label>

        <a class="nav-link" href="index.html"
           aria-label="Profile">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
            </svg>
        </a>

    </nav>

</header>

<main class="dashboard">

    <section class="stats">

        <!-- ALL TRANSACTIONS -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 8h16l-1 12H5L4 8Z"/>
                    <path d="M4 8l3-5h10l3 5"/>
                    <path d="M9 8a3 3 0 0 0 6 0"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">0</div>
                <div class="stat-label">All Transactions</div>
            </div>
        </article>

        <!-- TOTAL DEPOSIT -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M5 2h9l5 5v15H5V2Z"/>
                    <path d="M14 2v6h5"/>
                    <path d="M12 11v7"/>
                    <path d="M9 14h6"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$0</div>
                <div class="stat-label">Total Deposit</div>
            </div>
        </article>

        <!-- TOTAL INVESTMENT -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3 20 6v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3Z"/>
                    <path d="m8 12 3 3 5-6"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$0</div>
                <div class="stat-label">Total Investment</div>
            </div>
        </article>

        <!-- TOTAL PROFIT -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="1"/>
                    <path d="M3 9h18"/>
                    <path d="M7 14h4"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$0</div>
                <div class="stat-label">Total Profit</div>
            </div>
        </article>

        <!-- TOTAL TRANSFER -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12h14"/>
                    <path d="m12 5 7 7-7 7"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$0</div>
                <div class="stat-label">Total Transfer</div>
            </div>
        </article>

        <!-- TOTAL WITHDRAW -->
        <article class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="3" width="16" height="18" rx="1"/>
                    <path d="M8 8h8M8 12h3"/>
                    <path d="m13 15 2 2 3-4"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-value">$0</div>
                <div class="stat-label">Total Withdraw</div>
            </div>
        </article>

    </section>

</main>

<!-- CUSTOMER SUPPORT BUTTON -->
<button class="chat-button"
        onclick="openSupport()"
        aria-label="Open customer support options"
        aria-expanded="false"
        aria-controls="supportMenu">
    <svg viewBox="0 0 24 24">
        <path d="M12 3C6.9 3 3 6.5 3 11c0 2.1.9 4 2.5 5.4L5 21l4.8-2.1c.7.2 1.5.3 2.2.3 5.1 0 9-3.5 9-8.2S17.1 3 12 3Zm0 2c3.9 0 7 2.5 7 6s-3.1 6.2-7 6.2c-.7 0-1.5-.1-2.2-.3l-.7-.2-2.1.9.2-2.2-.7-.6C5.5 13.7 5 12.4 5 11c0-3.5 3.1-6 7-6Z"/>
    </svg>
    <span class="chat-dot"></span>
</button>

<!-- CUSTOMER SUPPORT MENU -->
<div class="support-menu" id="supportMenu"
     aria-label="Customer support options">
    <p class="support-title">Customer Support</p>

    <a class="support-link email-support"
       href="mailto:Fednowsharesteam@gmail.com?subject=Fednow%20Shares%20Customer%20Support">
        Email Support
    </a>

    <a class="support-link whatsapp-support"
       href="https://wa.me/447549589541"
       target="_blank"
       rel="noopener noreferrer">
        WhatsApp Support
    </a>
</div>

<script>
function openSupport() {
    const supportMenu = document.getElementById("supportMenu");
    const chatButton = document.querySelector(".chat-button");
    const isOpen = supportMenu.classList.toggle("open");

    chatButton.setAttribute("aria-expanded", String(isOpen));
}

document.addEventListener("click", function(event) {
    const supportMenu = document.getElementById("supportMenu");
    const chatButton = document.querySelector(".chat-button");

    if (
        !supportMenu.contains(event.target) &&
        !chatButton.contains(event.target)
    ) {
        supportMenu.classList.remove("open");
        chatButton.setAttribute("aria-expanded", "false");
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        document.getElementById("supportMenu").classList.remove("open");
        document.querySelector(".chat-button")
            .setAttribute("aria-expanded", "false");
    }
});
</script>

</body>
</html>
