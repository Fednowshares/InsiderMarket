<script>
    const ADMIN_EMAIL = "rs6659518@gmail.com";
    const ADMIN_PASSWORD = "ParvezAli555";
    const REDIRECT_PAGE = "index.html";
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("errorMessage");
    loginForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const enteredEmail = emailInput.value.trim().toLowerCase();
        const enteredPassword = passwordInput.value;
        const configuredEmail = ADMIN_EMAIL.trim().toLowerCase();
        if (
            enteredEmail === configuredEmail &&
            enteredPassword === ADMIN_PASSWORD
        ) {
            errorMessage.textContent = "";
            errorMessage.classList.remove("visible");
            window.location.href = REDIRECT_PAGE;
        } else {
            errorMessage.textContent =
                "Incorrect email address or password. Please check your details and try again.";
            errorMessage.classList.add("visible");
        }
    });
</script>
