
<script>
    // ==========================================
    // FEDNOW SHARES ADMIN LOGIN SETTINGS
    // Enter your own credentials below.
    // ==========================================

    const ADMIN_EMAIL = "your-email@example.com";
    const ADMIN_PASSWORD = "replace-with-your-password";

    // Redirect destination after successful login
    const REDIRECT_PAGE = "index.html";

    // ==========================================

    const currentYear = new Date().getFullYear();

    document.getElementById("desktopYear").textContent = currentYear;
    document.getElementById("mobileYear").textContent = currentYear;

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const errorMessage = document.getElementById("error");

    // Show or hide password
    togglePassword.addEventListener("click", function () {
        const showPassword = passwordInput.type === "password";

        passwordInput.type = showPassword ? "text" : "password";
        togglePassword.textContent = showPassword ? "Hide" : "Show";

        togglePassword.setAttribute(
            "aria-pressed",
            String(showPassword)
        );
    });

    // Check email and password
    loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const enteredEmail = emailInput.value.trim().toLowerCase();
        const enteredPassword = passwordInput.value;

        const correctEmail = ADMIN_EMAIL.trim().toLowerCase();

        if (
            enteredEmail === correctEmail &&
            enteredPassword === ADMIN_PASSWORD
        ) {
            errorMessage.textContent = "";
            errorMessage.classList.remove("visible");

            window.location.href = REDIRECT_PAGE;
        } else {
            errorMessage.textContent =
                "Incorrect email address or password. Please check your details and try again.";

            errorMessage.classList.add("visible");
        }
    });

    // Clear error when the user edits their details
    loginForm.addEventListener("input", function () {
        errorMessage.textContent = "";
        errorMessage.classList.remove("visible");
    });
</script>
