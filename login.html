<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | FedNow Shares</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f7fb;
  color: #34445c;
}

.login-box {
  width: 100%;
  max-width: 400px;
  background: white;
  padding: 35px 28px;
  border-radius: 12px;
  box-shadow: 0 5px 25px #10357015;
}

.logo {
  text-align: center;
  color: #103570;
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  margin-bottom: 8px;
  color: #103570;
}

.subtitle {
  text-align: center;
  color: #778395;
  font-size: 14px;
  margin-bottom: 28px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 13px;
  margin-bottom: 20px;
  border: 1px solid #d5deea;
  border-radius: 6px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #528fe0;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 6px;
  background: #528fe0;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #103570;
}

#error {
  color: #d93025;
  font-size: 14px;
  text-align: center;
  margin-top: 15px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 22px;
  color: #528fe0;
  text-decoration: none;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">FEDNOW SHARES</div>

  <h2>Admin Login</h2>

  <p class="subtitle">
    Sign in to access your dashboard
  </p>

  <form id="loginForm">

    <label for="email">Admin Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      autocomplete="current-password"
      required
    >

    <button type="submit">Login</button>

    <p id="error" role="alert"></p>

  </form>

  <a class="back" href="home.html">
    Back to Home
  </a>

</div>

<script>
// =====================================
// CHANGE ADMIN LOGIN DETAILS HERE
// =====================================

const ADMIN_EMAIL = "rs6659518@gmail.com";
const ADMIN_PASSWORD = "ParvezAli555";

// =====================================
// LOGIN CHECK
// =====================================

document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");

  if (
    email.toLowerCase() === ADMIN_EMAIL.toLowerCase() &&
    password === ADMIN_PASSWORD
  ) {
    sessionStorage.setItem("fednowDemoLogin", "true");

    window.location.href = "index.html";
  } else {
    error.textContent = "Incorrect email or password.";
  }
});
</script>

</body>
</html>
